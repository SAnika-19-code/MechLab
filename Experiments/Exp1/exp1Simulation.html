<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MechLab - Universal Force Table</title>

    <link rel="stylesheet" href="exp1Simulation.css">
</head>

<body>

    <h1>Universal Force Table</h1>
    <p>Adjust weights and angles to balance central ring.</p>

    <div class="layout">

        <!-- APPARATUS -->
        <section class="panel">
            <svg id="table" viewBox="50 69 483 481">
                <circle cx="300" cy="300" r="195"
                    fill="#e2e8f0" stroke="#475569" stroke-width="7"/>

                <circle cx="300" cy="300" r="180"
                    fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>

                <!-- Reference axes -->
                <line x1="100" y1="300" x2="500" y2="300"
                    stroke="#94a3b8" stroke-dasharray="6 6"/>

                <line x1="300" y1="100" x2="300" y2="500"
                    stroke="#94a3b8" stroke-dasharray="6 6"/>

                <!-- Degree labels -->
                <g fill="#475569" font-size="18" font-weight="bold">
                    <text x="305" y="95" text-anchor="middle">90°</text>
                    <text x="505" y="305">0°</text>
                    <text x="305" y="520" text-anchor="middle">270°</text>
                    <text x="60" y="305">180°</text>
                </g>

                <!-- Dynamic forces -->
                <g id="forces"></g>

                <!-- Movable central ring -->
                <g id="ringAssembly">
                    <circle cx="300" cy="300" r="17"
                        fill="none"
                        stroke="#334155"
                        stroke-width="2"/>

                    <circle cx="300" cy="300" r="2"/>
                </g>

            </svg>
        </section>

        <!-- CONTROLS -->
        <section class="panel" id="controls">

            <h2>Hanging Weights</h2>
            <div id="inputs"></div>
            <div class="buttons">
                <button class="add" id="addForce">+ Add Weight</button>
                <button class="remove" id="removeForce">− Remove Last</button>
                <button class="update" id="calculate">Calculate Resultant</button>
            </div>

        </section>
        <section class="panel">
            <div class="result">
                <h3>Calculated Results</h3>
                <div>Horizontal component: <b id="rx">0.00 N</b></div>
                <div>Vertical component: <b id="ry">0.00 N</b></div>
                <div>Resultant force: <b id="r">0.00 N</b></div>
                <div>Resultant angle: <b id="theta">—</b></div>
                <p id="status">Adjust the weights to achieve equilibrium.</p>
            </div>
        </section>
    </div>

    <script src="exp1Simulation.js"></script>

</body>
</html>

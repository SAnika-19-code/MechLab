<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MechLAB | Experiments</title>
    <link href="./stylesLab.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sedan+SC&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
</head>
<body>

    <header class="lab-header">
        <div class="hero-overlay"></div>

        <div class="header-content">
            <div class="nav-bar">
                <span class="material-symbols-outlined gradient-text">manufacturing</span>
                <a href="../index.html" id="title" class="gradient-text">MechLAB</a>
                <button class="menu-toggle-open" aria-label="Open Navigation">
                    <span class="material-symbols-outlined menu">menu</span>
                </button>

                <div class="nav-drawer">
                    <button class="menu-toggle-close" aria-label="Close Navigation">✕</button>
                    <ul class="nav-links">
                        <li><a href="../HomePage/index.html">Home</a></li>
                        <li><a href="./MechLab.html" class="active-link">Experiments</a></li>
                        <li><a href="../HomePage/about.html">About Us</a></li>
                    </ul>
                </div>
                <div class="drawer-overlay"></div>
            </div>

            <div class="header-text">
                <h1>Explore the <span class="gold">LAB</span></h1>
                <hr>
            </div>
        </div>

        <!-- Double Layer SVG Wave Transition matching index.html -->
        <div class="wave-container">
            <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
                <path class="wave-gold-line" d="M0,60 C360,130 720,20 1080,70 C1260,95 1380,85 1440,65 L1440,120 L0,120 Z"></path>
                <path class="wave-bottom-fill" d="M0,68 C360,138 720,28 1080,78 C1260,103 1380,93 1440,73 L1440,120 L0,120 Z"></path>
            </svg>
        </div>
    </header>

    <main class="lab-container">
        <div class="cards">
            <a href="./Exp1/exp1.html" title="Experiment 1" class="card-link">
                <div class="card">
                    <div class="exp-image">
                        <img class="apparatus" src="../Media/Universal Force Table.jpg" alt="Universal Force Table" title="Universal Force Table">
                        <span class="exp-number">EXPERIMENT 01</span>
                    </div>
                    <div class="exp-info">
                        <p class="exp-title">Verification of Law of Polygon of Forces</p>
                        <p class="exp-aim">To verify graphically the equilibrium of a particle using the Law of Polygon of Forces.</p>
                        <div class="card-footer">
                            <span>View Experiment</span>
                            <span class="material-symbols-outlined">arrow_circle_right</span>
                        </div>
                    </div>
                </div>
            </a>

            <!-- <a href="./Exp2/exp2.html" title="Experiment 2" class="card-link">
                <div class="card">
                    <div class="exp-image">
                        <img class="apparatus" src="../Media/Law of Moments Apparatus.jpg" alt="Law of Moments Apparatus" title="Law of Moments Apparatus">
                        <span class="exp-number">EXPERIMENT 02</span>
                    </div>
                    <div class="exp-info">
                        <p class="exp-title">Verification of Varignon's Theorem of Moments</p>
                        <p class="exp-aim">To verify Varignon's Theorem of Moments using a Law of Moments apparatus.</p>
                        <div class="card-footer">
                            <span>Launch Simulation</span>
                            <span class="material-symbols-outlined">arrow_circle_right</span>
                        </div>
                    </div>
                </div>
            </a> -->
        </div>
    </main>

    <script>
        const openBtn = document.querySelector('.menu-toggle-open');
        const closeBtn = document.querySelector('.menu-toggle-close');
        const drawer = document.querySelector('.nav-drawer');
        const overlay = document.querySelector('.drawer-overlay');

        function toggleMenu() {
            drawer.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        openBtn.addEventListener('click', toggleMenu);
        closeBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
